baseURL = 'https://hvini.github.io/'
title = 'My Blog'
theme = 'PaperMod'

enableRobotsTXT = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"] # Necessary for search

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  
  author = "Vinícius"
  displayFullLangName = true
  comments = true
  
  [params.assets]
    favicon = "<link / abs url>"

[languages]
  [languages.en]
    label = ":us: en"
    weight = 1
    title = "hvini.github.io"
    
    [languages.en.params.profileMode]
      enabled = true
      title = "Hello, I'm Vinícius"
      subtitle = "This is a space where I share general content, mainly about the principles, algorithms, and mathematical models behind machines’ ability to mimic human cognitive functions such as learning, reasoning, perception, and decision-making."
      imageUrl = "swim.png" 
      imageTitle = "Vini"
      imageWidth = 150
      imageHeight = 150
      [[languages.en.params.profileMode.buttons]]
        name = "Posts"
        url = "posts"
      [[languages.en.params.profileMode.buttons]]
        name = "Search"
        url = "search"
      [[languages.en.params.profileMode.buttons]]
        name = "GitHub"
        url = "https://github.com/hvini"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 20

  [languages.pt-br]
    label = ":brazil: pt"
    weight = 2
    title = "hvini.github.io"
    
    [languages.pt-br.params.profileMode]
      enabled = true
      title = "Olá, eu sou o Vinícius"
      subtitle = "Este é um espaço onde compartilho conteúdos diversos, principalmente sobre os princípios, algoritmos e modelos matemáticos por trás da capacidade das máquinas de imitar funções cognitivas humanas, como aprendizado, raciocínio, percepção e tomada de decisão."
      imageUrl = "swim.png" 
      imageTitle = "Vini"
      imageWidth = 150
      imageHeight = 150
      [[languages.pt-br.params.profileMode.buttons]]
        name = "Artigos"
        url = "posts"
      [[languages.pt-br.params.profileMode.buttons]]
        name = "Busca"
        url = "search"
      [[languages.pt-br.params.profileMode.buttons]]
        name = "GitHub"
        url = "https://github.com/hvini"

    [languages.pt-br.menu]
      [[languages.pt-br.menu.main]]
        identifier = "posts"
        name = "Artigos"
        url = "posts"
        weight = 10
      [[languages.pt-br.menu.main]]
        identifier = "search"
        name = "Busca"
        url = "search"
        weight = 20

[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"
